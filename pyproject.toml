[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veantaylen-enumdrift"
version = "0.1.0"
description = "统计各枚举值的出现频率随版本的变化，标出新增与消失的值"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "veantaylen" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://veantaylen.github.io"
Repository = "https://github.com/veantaylen/enumdrift"
Issues = "https://github.com/veantaylen/enumdrift/issues"

[project.scripts]
enumdrift = "enumdrift:main"

[tool.setuptools]
py-modules = ["enumdrift"]
